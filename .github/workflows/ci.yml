name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      # Python 3.14 is the **primary** interpreter: it is what the project is
      # developed and verified on, and it is the only version this workflow gates
      # per pull request.  A change has to survive it before it can merge.
      #
      # The matrix shape is kept with a single entry on purpose.  The job name
      # still says which interpreter ran it, and adding a version back later is a
      # one-line diff instead of a rewrite of this file.
      #
      # What changed, and what each version is now:
      #   * 3.14 -- required, every pull request, the complete suite;
      #   * 3.13 -- **transitional compatibility**: supported, no longer gated on
      #     every pull request.  Removing it from the matrix is a deliberate
      #     retirement, not a report that it broke;
      #   * 3.12 -- retired from routine CI.  It remains the declared floor in
      #     ``pyproject.toml``; see the note on ``requires-python`` below.
      matrix:
        python-version: ["3.14"]

    env:
      QT_QPA_PLATFORM: offscreen
      US_QUANT_SELF_TEST: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: src

    # Verification is four steps rather than one ``verify.ps1`` call so the log
    # says *which* gate took the time.  Before the split, a 7-13 minute run
    # reported one number and there was no way to see that pytest was ~99% of it.
    #
    # The single-version matrix runs the **complete** pytest suite, because a
    # smoke subset would buy nothing here -- there is no second job left to
    # parallelise with -- while removing the gate that catches a behaviour change
    # in the interpreter the project actually runs on.
    #
    # **The interpreter CI gates and the interpreter the package claims to
    # support are two different numbers, and this workflow only moves the
    # first.**  ``requires-python`` stays ``>=3.12``: support metadata is retired
    # separately and one step at a time (3.12 -> 3.13 -> 3.14 as the floor), so a
    # support claim is only ever narrowed after the version it drops has been out
    # of the gate long enough for that to be evidence rather than an intention.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and verification dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[desktop,test]"

      - name: Run tests
        shell: pwsh
        # ``-n 4 --dist=loadscope``: four explicit workers, never ``auto``.
        # This suite builds Qt applications, MainWindow instances, SQLite files
        # and temp trees, so an unbounded worker count is how a runner runs out
        # of CPU and RAM.  ``loadscope`` keeps a module's tests on one worker,
        # which is what keeps module fixtures and Qt global state intact.
        # Measured locally: ~70% off sequential wall time on the primary version.
        # ``--durations=30`` is capped deliberately -- ``0`` would print every
        # test and bury the signal in the log.
        run: python -m pytest -q -n 4 --dist=loadscope --durations=30

      - name: Doctor
        shell: pwsh
        run: python -m us_quant doctor

      - name: Compile
        shell: pwsh
        run: python -m compileall -q src tests

      - name: Desktop offscreen self-test
        shell: pwsh
        run: |
          python -c "import PySide6"
          python desktop_main.py
