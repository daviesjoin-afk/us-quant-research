[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "us-quant"
version = "0.20.0"
description = "Local-first US equities and ETF quantitative trading system"
requires-python = ">=3.12"
dependencies = [
  "tzdata>=2025.2",
  "websockets>=15,<17",
  # Ed25519 verification of detached research-evidence seals (Stage 6-B1).
  # The trading runtime verifies only; signing lives in research tooling.
  # Pinned deliberately: hand-rolling signature verification to avoid a
  # dependency would be exactly the self-made crypto this boundary must not use.
  "cryptography>=48,<50",
]

[project.optional-dependencies]
research = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
]
desktop = [
  "PySide6>=6.10,<6.12",
  "pyinstaller>=6.16,<7",
]
test = [
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
]

[project.scripts]
us-quant = "us_quant.cli:main"
us-quant-desktop = "us_quant.desktop:main"
# Research-side sealing surface.  Deliberately a separate entry point: the
# trading runtime must never be able to invoke signing.
us-quant-evidence-sealing = "us_quant.research_evidence_sealing:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runtime", "build", "dist", ".venv", ".venv313"]
addopts = "-ra"
